name: Compile LaTeX via GAS Trigger

on:
  repository_dispatch:
    types: [compile-tex]
  workflow_dispatch:
    inputs:
      folderId:
        description: 'Target Folder ID'
        required: true

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tkp-math/texlive-ja:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          apt-get update && apt-get install -y python3-pip
          python3 -m pip install --upgrade pip
          pip3 install google-auth google-auth-oauthlib google-api-python-client requests tqdm

      - name: Run LaTeX Compile and Upload
        env:
          # ... (既存の変数はそのまま) ...
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          INPUT_FOLDER_ID: ${{ github.event.client_payload.input_folder_id || inputs.folderId }}
          OUTPUT_FOLDER_ID: ${{ github.event.client_payload.output_folder_id || inputs.folderId }}
          GAS_UPLOAD_URL: ${{ secrets.GAS_UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.TEX_FILE_UPLOAD_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          SLACK_MENTION_USERS: ${{ github.event.client_payload.slack_mention_users }}

          # ★追加: リポジトリ情報と実行IDを渡す
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

        run: |
          # ★追加: コンパイル前に、IPAexフォントをPDFに埋め込むようシステム全体に指示する
          kanji-config-updmap-sys ipaex
          python3 scripts/compile_all_tex.py
